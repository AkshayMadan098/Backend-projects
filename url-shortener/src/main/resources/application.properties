spring.application.name=url-shortener
server.port=${PORT:8081}

# SQLite Database Configuration
# Local SQLite database file in the repository root (added to git under version control)
spring.datasource.url=jdbc:sqlite:urlshortener.db?journal_mode=WAL&busy_timeout=10000
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate ORM Dialect
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari Connection Pool Settings for SQLite
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JSON Formatting
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# VYSONM2A3: Middleware Configuration
blacklist.file.path=config/blacklist.txt
logging.middleware.enabled=true
logging.middleware.include-patterns=/**
logging.middleware.exclude-patterns=/health,/favicon.ico

# VYSONM2A4: API Versioning Configuration (Q14 BONUS & Core Versioning)
api.versioning.unspecified-strategy=DEFAULT_V1
api.versioning.default-version=v1
api.versioning.sunset-date=Wed, 01 Jun 2027 00:00:00 GMT
api.versioning.sunset-timestamp=1811817600
api.versioning.deprecation-warning=API v1 is deprecated and scheduled for sunset on 2027-06-01. Please migrate to API v2 (/v2/...)
api.versioning.successor-link=</v2/shorten>; rel="successor-version"


